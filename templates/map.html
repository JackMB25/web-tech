<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Map</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css">
        <script type="importmap">
		    {"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"}}
	    </script>
    </head>
    <body>
        {% include 'nav.html' %}
        
        <div id="map" style="width: 100%; height: calc(100vh - 56px);"></div>
        <script type="module">
            import {LeafletMap, TileLayer, Marker} from 'leaflet';

            const map = new LeafletMap('map').setView([53.2, -2.4], 10);

            new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            const response = await fetch("{{ url_for('api_sites') }}");
            const sites = await response.json();

            sites.forEach(site => {
                new Marker([site.lat, site.lon])
                    .addTo(map)
                    .bindTooltip(`${site.name} (${site.waterbody})`)
                    .on('click', () => {
                        window.location.href = `{{ url_for('dashboard') }}?site_id=${site.id}`;
                });
            });

        if (sites.length) {
            map.fitBounds(sites.map(s => [s.lat, s.lon]));
        }
    </script>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
